name: ByteLearn Production Deploy

on:
  push:
    branches: [ master ]

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Lint API Gateway
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          working-directory: ./apps/api-gateway

      - name: Run Go Backend Tests
        run: |
          go test ./apps/api-gateway/... -v
          go test ./apps/execution-service/... -v

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push API Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api-gateway/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bytelearn-api-gateway:latest

      - name: Build & Push Execution Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/execution-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bytelearn-execution:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bytelearn-frontend:latest