name: ByteLearn Production Deploy

on:
  push:
    branches: [ master ]

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run lint
        working-directory: apps/api-gateway
        run: golangci-lint run

      - name: Run Go Backend Tests
        run: |
          go test ./apps/api-gateway/... -v
          go test ./apps/execution-service/... -v

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push API Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api-gateway/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bytelearn-api-gateway:latest

      - name: Build & Push Execution Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/execution-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bytelearn-execution:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bytelearn-frontend:latest
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE }}

      - name: Build & Push Recommendation Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/recommendation-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bytelearn-recommendation:latest