services:
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  api-gateway:
    image: ${DOCKERHUB_USER}/bytelearn-api-gateway:latest
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_ADDR=redis:6379
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - RECOMMENDATION_URL=${RECOMMENDATION_URL}
      - GIN_MODE=release

  execution-service:
    image: ${DOCKERHUB_USER}/bytelearn-execution:latest
    restart: always
    depends_on:
      - redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/judge-workspaces:/tmp/judge-workspaces
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_ADDR=redis:6379

  recommendation-service:
    image: ${DOCKERHUB_USER}/bytelearn-recommendation:latest
    restart: always
    ports:
      - "8001:8001"
    depends_on:
      - redis
    environment:
      - RECOMMENDATION_DATABASE_URL=${RECOMMENDATION_DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_QUEUE=${REDIS_QUEUE}
      - GATEWAY_INTERNAL_URL=${GATEWAY_INTERNAL_URL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY}

  frontend:
    image: ${DOCKERHUB_USER}/bytelearn-frontend:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE=${VITE_API_BASE}

  watchtower:
    image: nickfedor/watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --cleanup