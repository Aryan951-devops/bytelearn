run:
  timeout: 5m
  issues-exit-code: 1

linters-settings:
  lll:
    line-length: 100

  funlen:
    lines: 80
    statements: 50

  gocyclo:
    min-complexity: 15

  govet:
    enable-all: true

linters:
  enable:
    # Default correctness
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errcheck

    # Code quality
    - gocyclo
    - funlen
    - lll
    - unconvert
    - prealloc

    # Style
    - misspell
    - revive

    # Safety
    - bodyclose

issues:
  exclude-use-default: false

  max-issues-per-linter: 0
  max-same-issues: 0

  # Ensure auto-generated mock or migration files don't trip up your linter rules
  exclude-dirs:
    - db/migrations
    - vendor